# Nutrient use efficiency ranges for the Colombian Andean profile. Read the
# global profile's file first: the structure and the caveats are the same.
#
# ---------------------------------------------------------------------------
# WHAT DIFFERS FROM `global`, AND WHAT DOES NOT
#
# NOTHING differs any more. Every nutrient in this profile now carries the
# same range as `global`.
#
# Nitrogen used to carry a -0.03 offset against the global grid, a
# stand-in for the stronger fixation of the volcanic-ash derived
# (allophanic) soils typical of the region. It went with the grid it
# offset: subtracting three points from a literature range reported as
# 30-50% would state an Andean figure to a precision the reference does
# not have, and the allophanic effect it stood for is real but unmeasured
# here.
#
# P, K, S, Ca, Mg and the micronutrients were already identical to global,
# for the same reason: the agronomist specified one range per group
# without distinguishing profiles.
#
# This profile is therefore currently a copy. It is kept rather than
# deleted because an exact row added here still wins over the sentinel, so
# the day there is Andean field data it lands in this file and nowhere
# else — and because the profile's OTHER reference files (the 500-product
# vademecum, the liming rules) are genuinely regional.
# ---------------------------------------------------------------------------

# ---- Nitrogen: 30-50% -------------------------------------------------------
# See the global profile's file for why the prototype sub-grid was deleted
# rather than rescaled into this band.
- texture: "any"
  irrigation: "any"
  nutrient: "N"
  efficiency_min: 0.30
  efficiency_max: 0.50
  source: "Yu_et_al_2022_meta_analysis_via_workflow_reference"
  region: "andina_colombia"

