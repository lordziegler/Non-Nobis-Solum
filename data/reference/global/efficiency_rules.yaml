# Nutrient use efficiency ranges by texture and irrigation system.
# Generalized from the N/P/K efficiency rules in Non-Nobis-Solum-Py
# (n.py/p.py/k.py) to the full texture x irrigation-system grid; S/Ca/Mg
# are treated as amendments applied near their full theoretical value.
- texture: "loam"
  irrigation: "rainfed"
  nutrient: "N"
  efficiency_min: 0.55
  efficiency_max: 0.65
  source: "Non_Nobis_Solum_Py_prototype_generalized"
  region: "global"
