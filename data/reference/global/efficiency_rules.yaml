# Nutrient use efficiency ranges, as the fraction of applied nutrient the
# crop actually recovers. `net_requirement_kg_ha` divides by the midpoint
# of the range, so halving an efficiency doubles the dose.
#
# ---------------------------------------------------------------------------
# HOW TO READ THIS FILE
#
# A row keyed on a real texture/irrigation pair wins; otherwise lookup
# falls back to the sentinel row (texture "any", irrigation "any"). Rows
# can therefore be added one class at a time without touching code.
#
# Every nutrient now carries a single sentinel range, because a single
# range is all anyone has actually specified for any of them. A per-texture
# grid invented by scaling a constant would look like knowledge and be
# noise.
#
# The ranges for P, K, S, Ca, Mg and the micronutrients were set by the
# project's agronomist. P (10-20%) and S (10-30%) coincide with the
# meta-analyses tabulated in the workflow reference (Yu et al. 2021 for P;
# Aula et al. 2019 for S); the 40-60% for the exchangeable bases is a
# working figure pending per-class field data.
# ---------------------------------------------------------------------------

# ---- Nitrogen: 30-50% -------------------------------------------------------
# Reconciled against the workflow reference's meta-analysis (Yu et al.
# 2022). This replaced the prototype's 0.45-0.80 texture x irrigation
# sub-grid, which sat entirely above the literature band: its most
# pessimistic cell (0.45) was above this range's midpoint.
#
# The sub-grid was DELETED rather than rescaled into the band. Its four
# cells came from the same prototype whose S/Ca/Mg figures were already
# discarded as fabricated, so squeezing them into a literature range would
# have dressed unsourced numbers in a citation. This is the same call
# session 10 made for potassium, for the same reason.
#
# The textural signal for N is real agronomy — a sandy soil under flood
# irrigation does leach more than a clay loam under drip — and losing it
# is the cost of not inventing it. An exact texture/irrigation row still
# wins over this sentinel, so measured per-class data lands one row at a
# time with no code change.
- texture: "any"
  irrigation: "any"
  nutrient: "N"
  efficiency_min: 0.30
  efficiency_max: 0.50
  source: "Yu_et_al_2022_meta_analysis_via_workflow_reference"
  region: "global"

# ---- Phosphorus: 10-20% -----------------------------------------------------
# Most of what is applied is fixed by the soil before the crop reaches it.
- texture: "any"
  irrigation: "any"
  nutrient: "P"
  efficiency_min: 0.10
  efficiency_max: 0.20
  source: "agronomist_specified_2026-07"
  region: "global"

