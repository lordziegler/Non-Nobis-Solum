# Product catalog. A regional profile ships its catalog in that region's
# language, and `andina_colombia`'s is Spanish — but almost none of it is a
# trade name. `Sulfato de amonio` is a compound with an exact English name,
# and printing it untranslated under an English interface is a gap, not a
# fact about the market. Keyed on `source_id` through `I18n::term`, so a
# product nobody has translated still prints the catalog's own name.
#
# The formula rows (NPK, bulk blends, organominerals — some four hundred of
# them) are not here: their identity is the grade, which is already a
# column, and translating an adjective around it buys nothing.
