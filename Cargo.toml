[package]
name = "non_nobis_solum"
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Ziegler"]
license = "GPL-3.0-or-later"
# Two binaries; keep bare `cargo run` meaning the CLI, as before.
default-run = "nns"
description = "Fertilization plan engine driven by soil analysis, crop removal coefficients, efficiency rules and fertilizer sources."

[lib]
name = "non_nobis_solum"
path = "src/lib.rs"

# Short enough to type twice. The crate keeps its full name, so
# uninstalling is still `cargo uninstall non_nobis_solum`.
[[bin]]
name = "nns"
path = "src/main.rs"

[[bin]]
name = "nns-tui"
path = "src/tui_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
csv = "1"
toml = "0.8"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
# Agroclimatic adapter. Blocking: the engine is synchronous end to end and
# one climatology fetch per plan doesn't justify an async runtime.
# rustls avoids a system OpenSSL build dependency (same choice as `vigil`).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
